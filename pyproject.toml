[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-platform"
version = "0.1.0"
description = "An end-to-end customer churn prediction platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "shap>=0.45",
    "streamlit>=1.39",
    "uvicorn[standard]>=0.29",
    "xgboost-cpu>=3.0,<4.0; sys_platform == 'linux'",
    "xgboost>=3.0,<4.0; sys_platform != 'linux'",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
churn-platform = "churn_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
